name: Weekly Keyword Research

on:
  schedule:
    - cron: '30 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Expand keyword queue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          KEYWORD_RESEARCH_COUNT: 20
          KEYWORD_EXISTING_LIMIT: 60
        run: npm run research:keywords

      - name: Commit keyword research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/keywords.txt
          if git diff --staged --quiet; then
            echo "No keyword changes to commit."
            exit 0
          fi
          git commit -m "Auto: expand GMRWS keyword queue"
          git pull --rebase --autostash
          git push
